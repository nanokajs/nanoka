name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:security-report

      - run: pnpm test:workerd-rpc

      - run: pnpm test:workerd-streams

      - name: Verify LICENSE files are in sync
        run: |
          if ! diff -q LICENSE packages/nanoka/LICENSE >/dev/null; then
            echo "::error::LICENSE files at repository root and packages/nanoka/ are out of sync."
            echo "Both files must be byte-identical. Run: cp LICENSE packages/nanoka/LICENSE"
            diff LICENSE packages/nanoka/LICENSE || true
            exit 1
          fi

      - run: pnpm -C packages/nanoka build

      - run: pnpm -C packages/nanoka test

      - run: pnpm -C packages/nanoka typecheck

      - run: pnpm -C packages/nanoka-auth build

      - run: pnpm -C packages/nanoka-auth test

      - run: pnpm -C packages/nanoka-auth typecheck

      - run: pnpm -C packages/create-nanoka-app build

      - run: pnpm test:pack

      - run: pnpm -C packages/create-nanoka-app test

      - run: pnpm -C packages/create-nanoka-app typecheck

      - run: pnpm -C site typecheck

      - run: pnpm -C examples/basic typecheck

      - run: pnpm -C examples/basic test

      - run: pnpm lint
