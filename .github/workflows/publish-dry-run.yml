name: Publish dry-run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/publish-dry-run.yml'
      - 'packages/nanoka/**'
      - 'packages/create-nanoka-app/**'
      - 'scripts/package-bin.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/nanoka build

      # --force skips npm's already-published-version guard; --dry-run still prevents publishing.
      - name: Publish @nanokajs/core (dry run)
        working-directory: packages/nanoka
        run: npm publish --dry-run --force

      - name: Build create-nanoka-app
        run: pnpm -C packages/create-nanoka-app build

      - name: Verify packed CLI entry points
        run: pnpm test:pack

      - name: Publish create-nanoka-app (dry run)
        working-directory: packages/create-nanoka-app
        run: npm publish --dry-run --force

      - run: pnpm -C packages/nanoka-auth build

      - name: Publish @nanokajs/auth (dry run)
        working-directory: packages/nanoka-auth
        run: npm publish --dry-run --force
