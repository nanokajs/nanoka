version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(actions)'
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      biome:
        patterns:
          - '@biomejs/biome'
        update-types: [minor, patch]
      libsql:
        patterns:
          - '@libsql/client'
        update-types: [minor, patch]
      satori:
        patterns:
          - 'satori'
        update-types: [minor, patch]
      minor-and-patch:
        exclude-patterns:
          - '@biomejs/biome'
          - '@libsql/client'
          - 'satori'
        update-types:
          - minor
          - patch
